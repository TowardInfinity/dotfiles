name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          . ./tools/go-tools.env
          go install "$STATICCHECK_MODULE@$STATICCHECK_VERSION"
          PATH="$(go env GOPATH)/bin:$PATH" ./bin/lint.sh

      - name: Shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              brew install shellcheck
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq shellcheck
            fi
          fi
          ./bin/shellcheck.sh

      - name: Test
        run: go test ./...

      - name: Self-test (shell, Python)
        run: ./bin/selftest.sh -v
