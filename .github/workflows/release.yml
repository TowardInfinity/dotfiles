---
name: Release

# Cuts a GitHub Release with prebuilt `dots` binaries whenever a `v*` tag is
# pushed, so machines running install.sh/dots.sh can fetch a binary instead of
# paying the ~10s / ~120MB cold Go build on every box (see bin/dots-resolve.sh,
# tier 2). workflow_dispatch exists so the build+test can be checked by hand
# without cutting a tag — it does NOT publish a release (no tag to attach one
# to), it only validates that every target still builds and tests pass.
#
# Two jobs, deliberately:
#
#   test     runs on Linux AND macOS, because half of what this repo ships is
#            shell that behaves differently on the two. `stat -f` is
#            --file-system on GNU and the format flag on BSD, and the version
#            of bin/selftest.sh that only ever ran on Linux shipped a broken
#            portability chain to a tagged release. macOS-only checks (the
#            --light guard) print "skip" on Linux and are otherwise never
#            exercised at all.
#   release  stays Linux-only and single. Cross-compilation already produces
#            all four targets from one runner, so a matrix here would gain
#            nothing and would race two publishes against the same tag.
#
# A macOS failure blocks publication. That is the point of the split, and it is
# not free: v0.1.9 would have been stopped by it. Stopping it would have been
# correct.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      # Report both platforms even when one fails. With fail-fast a Linux
      # error cancels the macOS leg, which hides exactly the divergence this
      # job exists to catch.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a mutable
      # pointer the action's owner can move at any time, and whatever this
      # job produces is downloaded and executed automatically by every
      # machine running install.sh — so "v4" silently becoming different
      # code is a supply-chain path straight onto four boxes. The version
      # each SHA corresponds to is in the trailing comment; bump both
      # together, deliberately.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Read from go.mod rather than hardcoding a version here, so bumping
          # the toolchain in one place is enough.
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # The shell and Python halves are not covered by `go test`, and both have
      # shipped a bug to a real machine — an unverified binary path and a
      # config file whose mode got widened. Runs hermetically (curl is stubbed).
      - name: Self-test (shell, Python)
        run: ./bin/selftest.sh -v

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch on a branch — no tag to stamp in, but the
            # build must still succeed so this path is worth exercising.
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross-compile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "==> building $goos/$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/dots_${goos}_${goarch}" ./cmd/dots
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum dots_* > checksums.txt

      - name: Show what will ship
        working-directory: dist
        run: ls -la && cat checksums.txt

      # Only push a release for an actual tag — workflow_dispatch stops here,
      # having proven the build and tests are green.
      #
      # DRAFT, deliberately. The signing key is offline (encrypted, on one
      # machine), so this job cannot sign the checksums.txt it just produced —
      # and a release that is Latest before it is signed is a window in which
      # the fleet installs unsigned bytes. Drafts are excluded from
      # /releases/latest/download: that path always redirects into the newest
      # PUBLISHED release, and a draft's own asset URL is 404 anonymously
      # (verified against this repo, not assumed). So nothing reachable exists
      # until `./bin/sign-release.sh <tag>` signs and publishes it.
      - name: Release (draft — sign it with bin/sign-release.sh)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            dist/dots_darwin_arm64
            dist/dots_darwin_amd64
            dist/dots_linux_arm64
            dist/dots_linux_amd64
            dist/checksums.txt
