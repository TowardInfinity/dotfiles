# Codex model policy for a ChatGPT Plus $20 plan.
#
# This file is not symlinked — it is MERGED into ~/.codex/config.toml by
# install.sh, between the "dots: managed" markers. Everything outside those
# markers in that file is left alone, because Codex writes to it itself:
# every "trust this directory" answer appends a [projects."/abs/path"] block
# and /plugins writes [plugins.*] entries, all machine-specific.
#
# So: edit the policy here, run `dots sync`, and every machine converges.
# Do not hand-edit the managed block in ~/.codex/config.toml — the next
# install overwrites it.
#
# The reasoning behind each choice is in `dots models`.

# Terra is the everyday tier: half Sol's price, and a larger 5-hour allowance
# (20-110 messages vs Sol's 15-90). Escalate a hard session with `codex -p sol`.
model = "gpt-5.6-terra"

# medium, not high. Effort is the sharpest single lever in this file — high and
# xhigh run several times the tokens of medium for the same prompt.
model_reasoning_effort = "medium"

# "user", not "auto_review". Each auto-review sub-call is a separately
# quota-consuming request, and it was firing nearly as often as the main model.
# This asks a human to approve risky commands instead — also the safer default.
approvals_reviewer = "user"

[agents]
# Subagents cost MORE total tokens than a comparable single-agent run: each
# keeps its own context and starts cold. They buy a smaller main context and
# parallelism, not savings. Kept available, at concurrency 1.
enabled = true
max_concurrent_threads_per_session = 1

# Terra, not Luna. Luna is within ~3 points of Terra on every agentic and coding
# benchmark but collapses to 41.3% on MRCR long-context recall (Terra 89.6%),
# and delegated work here is read-heavy by definition. Note this only applies to
# partial-history forks: a full-history fork inherits the parent model and
# effort and rejects overrides entirely. See `dots models` for the cost maths.
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"
interrupt_message = true

# One memory across every AI tool on the machine — see docs/memory.md. `dots`
# is already on PATH everywhere this file lands, so this is a plain command,
# not an absolute path: the same mistake install.sh:336 warns about for the
# vault itself. Shape matches what `codex mcp add dots-memory -- dots memory
# mcp` writes, verified against a scratch CODEX_HOME rather than guessed.
[mcp_servers.dots-memory]
command = "dots"
args = ["memory", "mcp"]
