
# ═══════════════════════════════════════════════════════════════
# ~/.config/tmux/tmux.conf — tmux 3.7 on macOS + Ghostty + zsh
# Prefix: Ctrl-a   (VM/remote tmux stays on Ctrl-b — see NESTING)
# ═══════════════════════════════════════════════════════════════

# ──── Prefix ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # Ctrl-a Ctrl-a → send a literal Ctrl-a
bind a   last-window          # Ctrl-a a → toggle last window

# ──── Terminal & colors ───────────────────────────────────────
# tmux-256color gives italics + proper 256; RGB feature gives truecolor.
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"
set -g  allow-passthrough on          # Kitty/iTerm image protocols, etc.
set -g  focus-events on               # vim/nvim autoread + FocusGained
set -g  escape-time 10                # low, but not 0 (0 breaks some Esc seqs)
set -g  repeat-time 400
set -g  history-limit 200000

# ──── Shell ───────────────────────────────────────────────────
set -g default-shell /bin/zsh
set -g default-command "exec /bin/zsh -l"   # login shell → PATH/sdkman/fnm sane

# ──── Mouse & indexing ────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g detach-on-destroy off          # killing a session → attach to another
set -g set-titles on
set -g set-titles-string "#{session_name} · #{window_name}"
set -g display-time 2500
set -g display-panes-time 2000

# ──── Clipboard ───────────────────────────────────────────────
# OSC 52 — works locally in Ghostty AND from tmux inside the VM over SSH.
set -g set-clipboard on

# ═══════════════════════════════════════════════════════════════
# KEYBINDINGS
# ═══════════════════════════════════════════════════════════════

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message " tmux.conf reloaded"
bind M-e new-window -n "conf" "\${EDITOR:-vim} ~/.config/tmux/tmux.conf"

# ──── Splits & windows (open in current working directory) ────
bind | split-window -h  -c "#{pane_current_path}"
bind - split-window -v  -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"   # full-height split
bind _ split-window -fv -c "#{pane_current_path}"   # full-width split
bind c new-window       -c "#{pane_current_path}"
unbind '"'
unbind %

# ──── Pane navigation — vim keys ──────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# ──── Pane resize — repeatable (hold the key) ─────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind    = select-layout even-horizontal
bind    + select-layout even-vertical
bind    z resize-pane -Z                  # zoom toggle (default, kept explicit)
bind    S set -w synchronize-panes \; display-message "sync-panes #{?pane_synchronized,ON,OFF}"

# ──── Pane management ─────────────────────────────────────────
bind x kill-pane                          # no confirmation prompt
bind X kill-window
bind Q confirm-before -p "kill session #S? (y/n)" kill-session
bind e break-pane                         # pane → its own window
bind m command-prompt -p "merge into window:" "join-pane -t '%%'"
bind Space next-layout
bind C-o rotate-window

# ──── Window navigation ──────────────────────────────────────
bind -r C-p previous-window
bind -r C-n next-window
bind -n S-Left  previous-window           # Shift-arrows, no prefix
bind -n S-Right next-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind . command-prompt -p "move window to:" "swap-window -t '%%'"
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ──── Sessions ────────────────────────────────────────────────
# Restatements of tmux defaults, not overrides. They behave exactly as they
# would if these lines were deleted. They are here because a default that is
# written down is a default the reference can describe — detach in particular
# went undocumented for a long time precisely because nothing bound it, and
# it is the most useful key in tmux.
bind d detach-client                      # leave, session keeps running
bind w choose-tree -Zw                    # window picker (matches Linux)

bind C-c new-session
bind '$' command-prompt -I "#S" "rename-session '%%'"
bind -r "(" switch-client -p
bind -r ")" switch-client -n

# fzf session switcher in a popup
bind s display-popup -E -w 60% -h 50% "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' \
  | sed '/^$/d' \
  | fzf --reverse --border=none --prompt='session > ' --header='switch session' \
  | xargs -r tmux switch-client -t"

# Create-or-switch to a session named after a project dir
bind P display-popup -E -w 70% -h 60% "\
  find ~/Codes -mindepth 2 -maxdepth 2 -type d 2>/dev/null \
  | fzf --reverse --prompt='project > ' \
  | xargs -r -I{} sh -c 'n=\$(basename {} | tr . _); \
      tmux has-session -t \"\$n\" 2>/dev/null || tmux new-session -ds \"\$n\" -c {}; \
      tmux switch-client -t \"\$n\"'"

# ──── Popups ──────────────────────────────────────────────────
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 70% "\$SHELL"
bind C-f display-popup -E -w 80% -h 70% "\
  tmux list-panes -a -F '#S:#I.#P #{pane_current_command} #{pane_current_path}' \
  | fzf --reverse --prompt='pane > ' \
  | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# ──── Copy mode — vi keys ────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "pbcopy; tmux paste-buffer"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind p paste-buffer -p
bind b list-buffers

# Mouse drag-select copies to the macOS clipboard, then clears selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane  send -X select-word \; send -X copy-pipe-no-clear "pbcopy"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear "pbcopy"

# Mouse wheel enters copy-mode instead of spamming the shell with arrow keys
bind -n WheelUpPane if -F "#{&&:#{mouse_any_flag},#{pane_in_mode}}" \
  "send -M" "if -Ft= '#{alternate_on}' 'send -M' 'copy-mode -et='"

# Right-click paste
bind -n MouseDown3Pane paste-buffer -p

# ═══════════════════════════════════════════════════════════════
# NESTING (Mac tmux → SSH → VM tmux)
# ═══════════════════════════════════════════════════════════════
# Primary scheme: prefixes differ, so nothing to toggle.
#   Ctrl-a → this (outer, macOS) session
#   Ctrl-b → the inner VM session   [leave the VM's tmux.conf on default]
#
# Fallback if you ever run the same prefix on both ends: F12 turns OFF every
# outer keybinding so all keys reach the inner tmux; F12 again turns it back on.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set -g status-style "bg=#292e42,fg=#545c7e" \;\
  set -g window-status-current-style "bg=#545c7e,fg=#1a1b26" \;\
  if -F "#{pane_in_mode}" "send -X cancel" \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -gu status-style \;\
  set -gu window-status-current-style \;\
  refresh-client -S

# ═══════════════════════════════════════════════════════════════
# STATUS BAR — Tokyo Night (matches the Ghostty theme)
# ═══════════════════════════════════════════════════════════════
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
# bg=default → inherits Ghostty's background-opacity/blur instead of an opaque bar
set -g status-style "bg=default,fg=#a9b1d6"

# Rounded-pill segments (  = Nerd Font powerline extras, present in JetBrainsMono NF)
#
# The left pill is a MODE BADGE. Instead of only changing colour, it changes text,
# so one glance tells you the state without decoding a hue:
#   blue  " main"    normal — showing the session name
#   red   "󰘳 PREFIX"  a prefix keypress is pending
#   amber " COPY"    copy-mode
#   gold  "󰓦 SYNC"    synchronize-panes is ON (easy to forget; this makes it loud)
set -g status-left-length 60
set -g status-left "\
#[fg=#{?client_prefix,#f7768e,#{?pane_in_mode,#ff9e64,#{?pane_synchronized,#e0af68,#7aa2f7}}},bg=default]\
#[fg=#1a1b26,bg=#{?client_prefix,#f7768e,#{?pane_in_mode,#ff9e64,#{?pane_synchronized,#e0af68,#7aa2f7}}},bold]\
#{?client_prefix,󰘳 PREFIX,#{?pane_in_mode, COPY,#{?pane_synchronized,󰓦 SYNC, #S}}}\
#[fg=#{?client_prefix,#f7768e,#{?pane_in_mode,#ff9e64,#{?pane_synchronized,#e0af68,#7aa2f7}}},bg=default,nobold] "

# Right: agent model · zoom · git branch · host (SSH-aware) · date · time
# The git segment only renders inside a repo, so it costs nothing elsewhere.
#
# The model segment is first because it is the one that costs money. It renders
# only when the pane is running Claude Code or Codex, and colours the name by
# price tier — red for opus/fable/sol, green for sonnet/terra, cyan for the
# cheap ones. See `dots models`.
set -g status-right-length 120
set -g status-right "\
#(~/.local/bin/tmux-model '#{pane_id}' '#{pane_current_command}' '#{pane_current_path}')\
#[fg=#e0af68,bg=default]#{?window_zoomed_flag,󰊓 zoom  ,}\
#[fg=#7aa2f7,bg=default]#(cd '#{pane_current_path}' 2>/dev/null && git branch --show-current 2>/dev/null | sed 's/^/ /')\
#[fg=#414868,bg=default]  #[fg=#9ece6a,bg=default]#{?SSH_CONNECTION,󰢹 ,󰇄 }#h \
#[fg=#414868,bg=default] #[fg=#7dcfff,bg=default]󰃭 %a %d %b \
#[fg=#414868,bg=default] #[fg=#bb9af7,bg=default,bold]󰥔 %H:%M "

# Windows — dim ghost text for inactive, filled pill for current
set -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89,bg=default]  #I #W#{?window_flags,#{window_flags},}  "
setw -g window-status-current-format "\
#[fg=#7aa2f7,bg=default]\
#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W#{?window_zoomed_flag, 󰊓,} \
#[fg=#7aa2f7,bg=default,nobold] "
setw -g window-status-activity-style "fg=#e0af68,bg=default"
setw -g window-status-bell-style "fg=#f7768e,bg=default,bold"

# ──── Pane titles (off by default — C-a B toggles) ────────────
# Useful in a 3+ pane layout to label what each pane is running.
set -g pane-border-format "#[fg=#{?pane_active,#7aa2f7,#414868}] #{?pane_active,󰄾 ,}#P #{pane_current_command} "
bind B set -w pane-border-status "#{?#{==:#{pane-border-status},off},top,off}"

# Panes
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines heavy
set -g pane-border-status off
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

# Messages / command prompt
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#ff9e64,fg=#1a1b26,bold"
set -g mode-style "bg=#3d59a1,fg=#c0caf5"

# Activity notifications (no audible bell)
set -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# ═══════════════════════════════════════════════════════════════
# PLUGINS (TPM) — prefix+I install, prefix+U update, prefix+alt-u clean
# ═══════════════════════════════════════════════════════════════
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: save/restore panes, contents, and neovim sessions
set -g @resurrect-dir "$HOME/.config/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh psql mysql sqlite3 "~claude" "~lazygit" "~btop" "~htop"'

# continuum: autosave every 10 min, auto-restore on tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

run '~/.config/tmux/plugins/tpm/tpm'
