# ═══════════════════════════════════════════════════════════════
# vm-tmux.conf — config for a1 (the server, Ubuntu 22.04, tmux 3.2a)
#
#   Deploy:  scp ~/.config/tmux/vm-tmux.conf a1:~/.tmux.conf
#            ssh a1 'tmux source-file ~/.tmux.conf'   # reloads live sessions
#
# Keeps the DEFAULT Ctrl-b prefix on purpose so it never fights the Mac
# session's Ctrl-a. Outer (Mac) = Ctrl-a, inner (a1) = Ctrl-b.
#
# Targets tmux 3.2a — deliberately avoids anything newer:
#   no allow-passthrough (3.3+), no popup -T/-S styling (3.3+), no fzf
#   (not installed on a1), no pbcopy (macOS-only). Uses choose-tree for
#   pickers instead of fzf popups.
# ═══════════════════════════════════════════════════════════════

# Prefix stays Ctrl-b — do not change; that is the whole nesting trick.

# ──── Terminal ────────────────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g  escape-time 10
set -g  repeat-time 400
set -g  focus-events on
set -g  history-limit 100000

# ──── Shell ───────────────────────────────────────────────────
set -g default-shell /usr/bin/zsh
set -g default-command "exec /usr/bin/zsh -l"

# ──── Basics ──────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g display-time 2500
set -g set-titles on
set -g set-titles-string "a1 · #{session_name} · #{window_name}"

# ──── Clipboard: OSC 52 ───────────────────────────────────────
# Copies here land on the macOS clipboard, through both tmux layers and
# the SSH pipe. This is why there is no pbcopy/xclip in this file.
set -g set-clipboard on

# ──── Keybindings (mirror the Mac muscle memory) ──────────────
bind r source-file ~/.tmux.conf \; display-message " a1 tmux.conf reloaded"
bind | split-window -h  -c "#{pane_current_path}"
bind - split-window -v  -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"
bind c new-window       -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind    = select-layout even-horizontal
bind    + select-layout even-vertical

bind x kill-pane
bind X kill-window
bind Q confirm-before -p "kill session #S? (y/n)" kill-session
bind e break-pane
bind S set -w synchronize-panes \; display-message "sync-panes #{?pane_synchronized,ON,OFF}"
bind a last-window
bind -r C-p previous-window
bind -r C-n next-window
bind -n S-Left  previous-window
bind -n S-Right next-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Pickers — choose-tree instead of fzf (a1 has no fzf installed)
bind s choose-tree -Zs      # sessions
bind w choose-tree -Zw      # windows
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 70% "/usr/bin/zsh"

# ──── Copy mode — vi keys ────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind p paste-buffer -p

# Wheel scroll enters copy-mode instead of spamming the shell
bind -n WheelUpPane if -F "#{&&:#{mouse_any_flag},#{pane_in_mode}}" \
  "send -M" "if -Ft= '#{alternate_on}' 'send -M' 'copy-mode -et='"

# ═══════════════════════════════════════════════════════════════
# STATUS BAR — same design language as the Mac, GREEN accent
# Green vs the Mac's blue is the at-a-glance "which layer am I in?" cue.
# ═══════════════════════════════════════════════════════════════
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#a9b1d6"

# Mode badge — changes TEXT as well as colour:
#   green "a1 · session" · red "󰘳 PREFIX" · amber " COPY" · gold "󰓦 SYNC"
# The "a1 ·" prefix means a stray screenshot always tells you where you were.
set -g status-left-length 60
set -g status-left "\
#[fg=#{?client_prefix,#f7768e,#{?pane_in_mode,#ff9e64,#{?pane_synchronized,#e0af68,#9ece6a}}},bg=default]\
#[fg=#1a1b26,bg=#{?client_prefix,#f7768e,#{?pane_in_mode,#ff9e64,#{?pane_synchronized,#e0af68,#9ece6a}}},bold]\
#{?client_prefix,󰘳 PREFIX,#{?pane_in_mode, COPY,#{?pane_synchronized,󰓦 SYNC,󰢹 a1 · #S}}}\
#[fg=#{?client_prefix,#f7768e,#{?pane_in_mode,#ff9e64,#{?pane_synchronized,#e0af68,#9ece6a}}},bg=default,nobold] "

# Right: zoom · git branch · load average · date · time
# Load average matters more here than on the Mac — this box runs the trading
# dashboard and long-lived agents, so a wedged process should be visible.
#
# a1's system clock is Etc/UTC while the Mac is IST, so a bare %H:%M here would
# disagree with the Mac's bar by 5h30m. Render IST as the primary time (matches
# your wall clock) with the raw UTC kept dim beside it — server logs and cron on
# this box are still UTC, so both are worth seeing. The VM's system timezone is
# deliberately left alone: changing it would shift trading-dashboard timestamps.
#
# NOTE the %% in the date jobs. tmux runs status-right through strftime BEFORE
# executing #(), so a plain "date +%H:%M" gets rewritten to "date +14:29" (the
# UTC time) and the job just echoes that back — silently showing UTC. %% escapes
# to a literal % so the shell sees the real format string. The bare %H:%MZ at the
# end is intentional: that one IS tmux's own strftime, giving server-local UTC.
set -g status-right-length 120
set -g status-right "\
#[fg=#e0af68,bg=default]#{?window_zoomed_flag,󰊓 zoom  ,}\
#[fg=#9ece6a,bg=default]#(cd '#{pane_current_path}' 2>/dev/null && git branch --show-current 2>/dev/null | sed 's/^/ /')\
#[fg=#414868,bg=default]  #[fg=#f7768e,bg=default]󰍛 #(cut -d' ' -f1-3 /proc/loadavg) \
#[fg=#414868,bg=default] #[fg=#7dcfff,bg=default]󰃭 #(TZ=Asia/Kolkata date '+%%a %%d %%b') \
#[fg=#414868,bg=default] #[fg=#bb9af7,bg=default,bold]󰥔 #(TZ=Asia/Kolkata date +%%H:%%M) IST\
#[fg=#565f89,bg=default,nobold] %H:%MZ "

# Windows
set -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89,bg=default]  #I #W#{?window_flags,#{window_flags},}  "
setw -g window-status-current-format "\
#[fg=#9ece6a,bg=default]\
#[fg=#1a1b26,bg=#9ece6a,bold] #I #W#{?window_zoomed_flag, 󰊓,} \
#[fg=#9ece6a,bg=default,nobold] "
setw -g window-status-activity-style "fg=#e0af68,bg=default"
setw -g window-status-bell-style "fg=#f7768e,bg=default,bold"

# Panes
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#9ece6a"
set -g pane-border-lines heavy
set -g pane-border-status off
set -g pane-border-format "#[fg=#{?pane_active,#9ece6a,#414868}] #{?pane_active,󰄾 ,}#P #{pane_current_command} "
bind B set -w pane-border-status "#{?#{==:#{pane-border-status},off},top,off}"
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#9ece6a"

# Messages / copy-mode selection
set -g message-style "bg=#9ece6a,fg=#1a1b26,bold"
set -g message-command-style "bg=#ff9e64,fg=#1a1b26,bold"
set -g mode-style "bg=#2d4f2d,fg=#c0caf5"

set -g monitor-activity on
set -g visual-activity off
set -g bell-action none
